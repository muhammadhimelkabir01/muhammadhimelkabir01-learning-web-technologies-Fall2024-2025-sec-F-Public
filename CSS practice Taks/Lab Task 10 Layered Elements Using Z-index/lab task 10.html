<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Task 10 - Z Index</title>
    <style>
        .box {
            width: 200px;
            height: 150px;
            position: absolute;
            color: white;
            font-size: 20px;
            padding: 10px;
        }

        .box1 {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 1;
        }

        .box2 {
            background-color: blue;
            top: 80px;
            left: 80px;
            z-index: 2;
        }

        .box3 {
            background-color: green;
            top: 110px;
            left: 110px;
            z-index: 3;
        }
    </style>
</head>
<body>

<div class="box box1">Box 1</div>
<div class="box box2">Box 2</div>
<div class="box box3">Box 3</div>

</body>
</html>
