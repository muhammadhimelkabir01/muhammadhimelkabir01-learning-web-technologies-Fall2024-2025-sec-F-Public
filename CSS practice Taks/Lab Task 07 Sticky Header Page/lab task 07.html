<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header Blog Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            line-height: 1.6;
        }

        /* Sticky Header */
        header {
            position: sticky;   /* Stays while scrolling */
            top: 0;             /* Sticks to top */
            background-color: #0059b3;
            color: white;
            padding: 15px 20px;
            border-bottom: 3px solid #003d80;
            z-index: 100;
        }

        /* Navigation links */
        header a {
            color: #ffeb99;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        header a:hover {
            color: white;
        }

        /* Main Content */
        .content {
            margin-top: 30px;   /* Prevent overlap under sticky header */
            padding: 20px;
        }
    </style>

</head>
<body>

    <!-- Sticky Header -->
    <header>
        <h2 style="display: inline-block; margin-right: 40px;">Tech Blog</h2>
        <a href="#">Home</a>
        <a href="#">Articles</a>
        <a href="#">Reviews</a>
        <a href="#">Contact</a>
    </header>

    <!-- Long Scrollable Content -->
      <div class="content">
        <h2>Latest Article</h2>

        <p>Paragraph 1  </p>
        <p>Paragraph 2 </p>
        <p>Paragraph 3  </p>
        <p>Paragraph 4  </p>
        <p>Paragraph 5 </p>
        <p>Paragraph 6  </p>
       
    </div>

</body>
</html>
