<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        /* Navigation bar */
        nav {
            background-color: #0059b3;
            padding: 15px;
            width: 100%;
            display: block; /* Full width bar */
        }

        /* Nav links horizontally */
        nav a {
            display: inline-block;
            margin: 0 20px;           /* space between links */
            padding: 10px 15px;       /* padding for click area */
            color: white;
            text-decoration: none;    /* remove underline */
            font-size: 18px;
        }

        /* Hover effect */
        nav a:hover {
            background-color: #003d80;
            color: #ffeb99;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
