<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Boxes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Product box default styling */
        .product-box {
            display: inline-block;        /* show in one row */
            width: 250px;
            background-color: white;
            border: 2px solid #ccc;
            padding: 20px;
            margin: 20px;
            text-align: center;           /* center content */
            border-radius: 10px;
            transition: 0.3s;
        }

        /* Hover outline effect */
        .product-box:hover {
            outline: 3px solid #3399ff;
            outline-offset: 6px;
        }

        /* Product images */
        .product-box img {
            width: 120px;
            height: 120px;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: #0077b3;
        }

        a.buy-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #0080ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a.buy-btn:hover {
            background-color: #0059b3;
        }
    </style>

</head>
<body>

    <h1>Featured Products</h1>

    <!-- Product 1 -->
    <div class="product-box">
        <img src="laptop.jpg" alt="Laptop">
        <div class="product-name">Laptop</div>
        <p>High-performance laptop for work and gaming.</p>
        <div class="price">$899</div>
        <a class="buy-btn" href="#">Buy Now</a>
    </div>

    <!-- Product 2 -->
    <div class="product-box">
        <img src="headphones.jpg" alt="Headphones">
        <div class="product-name">Headphones</div>
        <p>Noise-cancelling premium quality headphones.</p>
        <div class="price">$199</div>
        <a class="buy-btn" href="#">Buy Now</a>
    </div>

    <!-- Product 3 -->
    <div class="product-box">
        <img src="smartwatch.webp" alt="Smartwatch">
        <div class="product-name">Smartwatch</div>
        <p>Track fitness, notifications, and more.</p>
        <div class="price">$249</div>
        <a class="buy-btn" href="#">Buy Now</a>
    </div>

</body>
</html>
