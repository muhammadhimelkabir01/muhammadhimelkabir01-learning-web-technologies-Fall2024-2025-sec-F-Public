<!DOCTYPE html>
<html>

<head>
  <title>Last lab mid</title>

  <style>
    .container {
      display: flex;
      gap: 10px;
      margin: 20px;
    }

    input,
    select,
    button{
      padding: 8px;
    }

    .box {
      margin: 20px;
      padding: 15px;
      border: 1px solid #000;
      width: 150px;
      font-size: 18px;
    }

    .saved-box {
      margin: 20px;
      padding: 15px;
      border: 2px solid green;
      width: 320px;
      font-size: 18px;
    }
    

    .error {
      color: red;
      margin: 20px;
      font-size: 18px;
      display: none;
    }

    .output-container {
      display: flex;
      gap: 10px;
  
    }
  </style>
</head>

<body>

  <div class="container">
    <input type="text" id="textInput" placeholder="Enter text...">

    <select id="dropdown">
      <option>Rolls Royce</option>
      <option>BMW</option>
      <option>Range Rover</option>
      <option>Mustang</option>
      <option>AUDI</option>
      <option>Marcity</option>
    </select>

    <button id="addBtn">Add</button>

  </div>

  <!-- Error Message -->
  <div class="error" id="errorMsg">⚠ Please enter text before proceeding!</div>

  <!-- Two output boxes -->
  <div class="output-container">
    <div class="box" id="box1"> </div>
    <div class="box" id="box2"> </div>
</div>


  <div style="margin:20px;">
  <button id="saveBtn">Save</button>
</div>


  <!-- Saved List Box -->
  <div class="saved-box" id="savedList">
    <strong> </strong><br><br>
  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const box1 = document.getElementById("box1");
    const box2 = document.getElementById("box2");
    const savedList = document.getElementById("savedList");
    const errorMsg = document.getElementById("errorMsg");

    function showError() {
      errorMsg.style.display = "block";
    }

    function hideError() {
      errorMsg.style.display = "none";
    }

    document.getElementById("addBtn").addEventListener("click", function () {
      let userText = textInput.value.trim();

      if (userText === "") {
        showError();
        return;
      }

      hideError();

      let selectedItem = document.getElementById("dropdown").value;
      box1.textContent = " " + userText;
      box2.textContent = " " + selectedItem;
    });

    document.getElementById("saveBtn").addEventListener("click", function () {
      let userText = textInput.value.trim();

      if (userText === "") {
        showError();
        return;
      }

      hideError();

      let selectedItem = document.getElementById("dropdown").value;

      let newEntry = document.createElement("div");
      newEntry.textContent = " " + userText + " : " + selectedItem;

      savedList.appendChild(newEntry);
    });

    textInput.addEventListener("input", hideError); 
  </script>

</body>

</html>
